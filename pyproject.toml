[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "focusvm"
description = "A Linux development environment for independent programming"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
focusvm = "focusvm.cli:main"

[project.optional-dependencies]
gui = ["PySide6>=6.8"]
dev = [
    "build>=1.2",
    "mypy>=1.15",
    "pip-audit>=2.8",
    "pyright>=1.1.396",
    "pytest>=8.3",
    "pytest-cov>=7",
    "pytest-qt>=4.5",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.dynamic]
version = { attr = "focusvm.__version__" }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "strict"

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
platform = "linux"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
qt_api = "pyside6"

[tool.coverage.run]
branch = true
patch = ["subprocess"]
