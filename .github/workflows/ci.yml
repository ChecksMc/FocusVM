name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 openssl qemu-utils xorriso
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,gui]'
      - name: Check formatting and lint
        run: |
          ruff format --check .
          ruff check .
          bash -n guest/verify.sh
          for script in install.sh uninstall.sh setup-fedora.sh; do
            sh -n "$script"
          done
      - name: Check types
        run: |
          python -m pyright --pythonpath "$(command -v python)"
          mypy
      - name: Test with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest --cov=focusvm --cov-report=term-missing --cov-fail-under=75
      - name: Audit dependencies
        run: pip-audit --skip-editable
      - name: Build and smoke test the package
        run: |
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          mkdir "$work/source"
          git archive HEAD | tar -x -C "$work/source"
          python -m build --outdir "$work/dist" "$work/source"
          python -m scripts.check_distribution "$work/dist"
          for asset in "$work/dist/"*.whl "$work/dist/"*.tar.gz; do
            smoke_dir=$(mktemp -d "$work/smoke.XXXXXX")
            python -m venv "$smoke_dir/venv"
            if [[ "$asset" == *.whl ]]; then
              "$smoke_dir/venv/bin/python" -m pip install --no-index "$asset"
            else
              "$smoke_dir/venv/bin/python" -m pip install --no-deps "$asset"
            fi
            (
              cd "$smoke_dir"
              "$smoke_dir/venv/bin/python" - <<'PY'
          from importlib.metadata import distribution
          from os import environ

          dist = distribution("focusvm")
          assert dist.metadata["License-Expression"] == "MIT"
          assert set(dist.metadata.get_all("License-File", [])) == {"LICENSE", "NOTICE"}
          files = {file.as_posix().split("/", 1)[1] for file in dist.files or ()
                   if ".dist-info/licenses/" in file.as_posix() and file.locate().is_file()}
          assert files == {"licenses/LICENSE", "licenses/NOTICE"}
          if environ["GITHUB_REF_TYPE"] == "tag":
              assert environ["GITHUB_REF_NAME"] == f"v{dist.version}"
          PY
              export XDG_CACHE_HOME="$smoke_dir/cache"
              export XDG_CONFIG_HOME="$smoke_dir/config"
              export XDG_DATA_HOME="$smoke_dir/data"
              export XDG_STATE_HOME="$smoke_dir/state"
              focusvm="$smoke_dir/venv/bin/focusvm"
              "$focusvm" --help
              "$focusvm" --version
              "$focusvm" init --storage-pool focusvm
              "$focusvm" config validate
              test "$("$focusvm" list --json)" = '[]'
              "$focusvm" profiles list --json
              test "$("$focusvm" session status --json)" = 'null'
            )
          done
