name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 openssl xorriso
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,gui]'
      - name: Check formatting and lint
        run: |
          ruff format --check .
          ruff check .
          bash -n guest/verify.sh
      - name: Check types
        run: |
          python -m pyright --pythonpath "$(command -v python)"
          mypy
      - name: Test with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest --cov=focusvm --cov-report=term-missing
      - name: Audit dependencies
        run: pip-audit --skip-editable
      - name: Build and smoke test the package
        run: |
          python -m build
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar

          [source] = Path('dist').glob('*.tar.gz')
          with open_tar(source) as archive:
              files = {Path(*member.name.split('/')[1:]).as_posix()
                       for member in archive if member.isfile()}
          required = {'LICENSE', 'NOTICE', 'CHANGELOG.md', 'CONTRIBUTING.md',
                      'README.md', 'SECURITY.md', 'docs/setup.md', 'guest/build.py',
                      'guest/fedora-44.ks', 'guest/verify.sh'}
          missing = required - files
          if missing:
              raise SystemExit(f'Source distribution is missing {sorted(missing)}')
          PY
          smoke_dir=$(mktemp -d)
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install --no-index dist/*.whl
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" - <<'PY'
          from importlib.metadata import distribution

          dist = distribution('focusvm')
          assert dist.metadata['License-Expression'] == 'MIT'
          assert set(dist.metadata.get_all('License-File', [])) == {'LICENSE', 'NOTICE'}
          files = {file.as_posix().split('/', 1)[1] for file in dist.files or ()
                   if '.dist-info/licenses/' in file.as_posix() and file.locate().is_file()}
          assert files == {'licenses/LICENSE', 'licenses/NOTICE'}
          PY
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$("$smoke_dir/venv/bin/python" -c 'from importlib.metadata import version; print(version("focusvm"))')
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          "$smoke_dir/venv/bin/focusvm" --help
          "$smoke_dir/venv/bin/focusvm" --version
          export XDG_CACHE_HOME="$smoke_dir/cache"
          export XDG_CONFIG_HOME="$smoke_dir/config"
          export XDG_DATA_HOME="$smoke_dir/data"
          export XDG_STATE_HOME="$smoke_dir/state"
          "$smoke_dir/venv/bin/focusvm" init --storage-pool focusvm
          "$smoke_dir/venv/bin/focusvm" config validate
          "$smoke_dir/venv/bin/focusvm" list --json
          "$smoke_dir/venv/bin/focusvm" profiles list --json
          "$smoke_dir/venv/bin/focusvm" session status --json
